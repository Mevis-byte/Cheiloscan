[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cheiloscan"
version = "0.1.0"
description = "CheiloScan - experimental local-first lip-print analysis and comparison research application"
requires-python = ">=3.11"
dependencies = [
    # Phase 1: backend foundation.
    "flask>=3.0,<4",
    "sqlalchemy>=2.0,<3",
    "python-dotenv>=1.0,<2",
    # Phase 2: image acquisition and preprocessing.
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    # Production WSGI server (cross-platform, single process).
    "waitress>=3.0,<4",
    # Serverless deployment (Neon/Postgres + Vercel Blob).
    "psycopg[binary]>=3.1,<4",
    "vercel-blob>=0.6,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.vercel]
entrypoint = "wsgi:app"

[tool.vercel.scripts]
build = "python scripts/sync_public.py"

[tool.setuptools.packages.find]
include = ["app*", "cheiloscan*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: pure unit tests (no application, database or HTTP)",
    "integration: tests exercising the application factory, database and API",
    "regression: golden-file regression tests (deterministic pipeline outputs)",
]

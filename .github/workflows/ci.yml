name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lockfile and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.26
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Sync locked dependencies (including dev tools)
        run: uv sync --frozen

      - name: Run test suite
        run: uv run --frozen pytest -q

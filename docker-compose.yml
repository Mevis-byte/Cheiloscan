services:
  cheiloscan:
    build: .
    image: cheiloscan:0.1.0
    restart: unless-stopped
    # Expose only to the host's reverse proxy. For a Docker network with
    # nginx/Traefik, replace this with an internal network instead.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      CHEILOSCAN_ENV: production
      CHEILOSCAN_DATA_DIR: /data
      CHEILOSCAN_HOST: 0.0.0.0
      CHEILOSCAN_PORT: "8000"
      CHEILOSCAN_BEHIND_PROXY: "1"
      CHEILOSCAN_FORCE_HTTPS: "1"
      CHEILOSCAN_ALLOWED_HOSTS: ${CHEILOSCAN_ALLOWED_HOSTS:?Set CHEILOSCAN_ALLOWED_HOSTS in .env}
    volumes:
      - cheiloscan-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cheiloscan-data:
